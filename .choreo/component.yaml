schemaVersion: 1.1
endpoints:
  - name: echo_bff
    displayName: Echo BFF
    service:
      basePath: /
      port: 9090
    type: REST
    networkVisibilities: 
      - Public
dependencies:
    connectionReferences:
    - name: proxy-be-conn
      resourceRef: service:/sourceconfigvalchaths/test-backend/v1/proxy/PUBLIC
configuration:
  env:
    - name: MOCK_PROXY_URL
      valueFrom: 
        connectionRef:
          name: proxy-be-conn
          key: ServiceURL
    - name: MOCK_PROXY_API_KEY
      valueFrom: 
        connectionRef:
          name: proxy-be-conn
          key: ChoreoAPIKey
    - name: MOCK_PROXY_CONSUMER_SECRET
      valueFrom: 
        connectionRef:
          name: proxy-be-conn
          key: ConsumerSecret
    - name: MOCK_PROXY_TOKEN_URL
      valueFrom: 
        connectionRef:
          name: proxy-be-conn
          key: TokenURL
    - name: MOCK_PROXY_CONSUMER_KEY
      valueFrom: 
        connectionRef:
          name: proxy-be-conn
          key: ConsumerKey
